name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Ubuntu 寫死版本、不用 ubuntu-latest：latest 換版時分批切換，同一個 PR 的 job 會跑在不同映像上。三處一起改
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # key 不含 workflow 的步驟與映像版本，命中就不重存：加步驟或換映像時把版號加一
          prefix-key: v1-rust
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
