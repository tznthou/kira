[package]
name = "phase2-step0-probe"
version = "0.0.0"
edition = "2021"
publish = false

# 與 kira/src-tauri 同一個 git2 版本（0.19.0 → libgit2-sys 0.17.0+1.8.1）；
# 只開 vendored-libgit2：要驗的 API 與 https / openssl 無關
[dependencies]
git2 = { version = "=0.19.0", default-features = false, features = ["vendored-libgit2"] }
